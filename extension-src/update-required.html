<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cập nhật bắt buộc · TikTok by TDT</title>
  <link rel="stylesheet" href="update-required.css">
  <script src="update-required.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="logo">T</div><div><strong>TikTok by TDT</strong><small>@tranductai</small></div></div>
    <div class="symbol">↑</div>
    <span class="kicker">CẬP NHẬT BẮT BUỘC</span>
    <h1>Extension cần được cập nhật</h1>
    <p id="message">Đang kiểm tra phiên bản mới nhất từ máy chủ…</p>
    <div class="versions"><div><small>Hiện tại</small><b id="currentVersion">—</b></div><i>→</i><div><small>Mới nhất</small><b id="latestVersion">—</b></div></div>
    <div id="notes" class="notes" hidden></div>
    <button id="updateButton" class="primary" disabled>Tải và cập nhật ngay</button>
    <button id="checkButton" class="secondary">Kiểm tra lại</button>
    <p class="help">Extension đã tự khóa để tránh lỗi không tương thích. Với bản Load unpacked, hãy giải nén gói vừa tải và nạp lại thư mục trong chrome://extensions.</p>
    <div id="status" class="status"></div>
  </main>
</body>
</html>
