<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TikTok by TDT · Update Server</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#070910;color:#f8fafc}*{box-sizing:border-box}body{margin:0;display:grid;min-height:100vh;place-items:center;padding:24px;background:radial-gradient(circle at 50% -10%,#fe2c5529,transparent 38%),#070910}.card{width:min(680px,100%);padding:28px;border:1px solid #263044;border-radius:24px;background:linear-gradient(155deg,#111827,#090d16);box-shadow:0 30px 90px #0008}h1{margin:0;font-size:30px}p{color:#aab4c7;line-height:1.6}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}.meta div{padding:14px;border:1px solid #222c3c;border-radius:16px;background:#ffffff08}.meta small{display:block;color:#7d899f}.meta strong{display:block;margin-top:5px}.notes{padding:13px;border-left:3px solid #fe2c55;border-radius:0 12px 12px 0;background:#ffffff08;white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}a{padding:12px 16px;border-radius:12px;color:white;text-decoration:none;font-weight:800;background:#fe2c55}a.secondary{background:#1d2635}.mandatory{color:#ff9db1}</style>
  <script src="release.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>TikTok by TDT</h1>
    <p>Máy chủ lưu trữ và phân phối bản cập nhật riêng.</p>
    <div class="meta"><div><small>Phiên bản mới nhất</small><strong id="version">Đang tải…</strong></div><div><small>Trạng thái</small><strong id="mandatory">Đang kiểm tra…</strong></div></div>
    <div id="notes" class="notes">Đang đọc ghi chú phát hành…</div>
    <div class="actions"><a id="download" href="/api/v1/extension/download">Tải bản mới nhất</a><a class="secondary" href="/api/v1/extension/update-manifest">Xem manifest JSON</a></div>
  </main>
</body>
</html>
